# Render Blueprint for the Field Pro app (web + API + PostgreSQL/PostGIS).
# Free plans: services sleep after inactivity (first request wakes them in about a minute) and the
# free database expires 30 days after creation unless upgraded.
databases:
  - name: curb-connect-db
    plan: free
    region: ohio
    postgresMajorVersion: '17'
    databaseName: curb_connect_db
    user: curb_connect_db_user
    ipAllowList: [] # private network only

services:
  - type: web
    name: curb-connect-api
    runtime: node
    plan: free
    region: ohio
    buildCommand: npm ci --include=dev && npm run build -w @fieldline/api
    # Migrates, enables the restricted fieldline_app login, then starts dist/main.js and the job
    # worker (dist/worker.js) in the same instance (WORKER_INLINE=false turns the worker off).
    startCommand: cd apps/api && node scripts/render-start.mjs
    healthCheckPath: /v1/health
    envVars:
      - key: NODE_VERSION
        value: '24'
      - key: NODE_ENV
        value: production
      - key: API_HOST
        value: 0.0.0.0
      - key: API_PORT
        value: '10000'
      - key: TRUST_PROXY
        value: 'true'
      - key: DATABASE_URL
        fromDatabase:
          name: curb-connect-db
          property: connectionString
      - key: APP_DB_PASSWORD
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      # The browser only talks to the web origin; it proxies /v1 to this service.
      - key: APP_ORIGIN
        value: https://curb-connect-web.onrender.com
      - key: API_ORIGIN
        value: https://curb-connect-web.onrender.com
      - key: STORAGE_DRIVER
        value: local
      # AES-256-GCM key for local storage: base64 of 32 random bytes. Entered once in the Render
      # dashboard (sync: false); the Blueprint never overwrites it. Without it uploads fail.
      - key: STORAGE_ENCRYPTION_KEY
        sync: false
      # Free plans have no background workers, so the job worker runs inside the API instance.
      # Set to 'false' once a separate background worker service runs dist/worker.js.
      - key: WORKER_INLINE
        value: 'true'
      - key: WORKER_CONCURRENCY
        value: '1'
      # Sign-in (docs/deploy-render.md). MICROSOFT_TENANT_ID=common allows any Microsoft account.
      # Entered in the Render dashboard; the Blueprint never overwrites them.
      - key: MICROSOFT_TENANT_ID
        sync: false
      - key: MICROSOFT_CLIENT_ID
        sync: false
      - key: MICROSOFT_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Optional government bid search key. Enter in Render dashboard; not bundled in Next.js.
      - key: SAM_GOV_API_KEY
        sync: false
      # Optional Google Places (New) key: turns on the daily Texas company search in Bidding.
      - key: GOOGLE_PLACES_API_KEY
        sync: false
      # Postal address shown in every email footer (CAN-SPAM). A PO box or mail drop is fine.
      - key: MAIL_POSTAL_ADDRESS
        sync: false
      # Optional SMTP server for outgoing mail. When unset, password accounts are auto-verified so
      # users are not locked out waiting for a verification email that never arrives. Example:
      # smtps://user:pass@smtp.example.com:465  or  smtp://localhost:587
      - key: SMTP_URL
        sync: false
      # Invoice email from each member's own Gmail / Outlook (docs/email-sending.md).
      - key: MAILER_URL
        value: https://curb-connect-mailer.onrender.com
      - key: MAILER_PUBLIC_ORIGIN
        value: https://curb-connect-mailer.onrender.com
      - key: MAILER_SHARED_SECRET
        fromService:
          type: web
          name: curb-connect-mailer
          envVarKey: MAILER_SHARED_SECRET
      - key: LOG_LEVEL
        value: info

  # Mail server (apps/mailer): Google / Microsoft sign-in for members' mailboxes and invoice sending.
  # Its own app keys, separate from the API's sign-in keys and from any other project's.
  - type: web
    name: curb-connect-mailer
    runtime: node
    plan: free
    region: ohio
    buildCommand: npm ci --include=dev
    startCommand: cd apps/mailer && npx tsx src/main.ts
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: '24'
      - key: NODE_ENV
        value: production
      - key: MAILER_HOST
        value: 0.0.0.0
      - key: MAILER_PORT
        value: '10000'
      - key: TRUST_PROXY
        value: 'true'
      - key: MAILER_PUBLIC_ORIGIN
        value: https://curb-connect-mailer.onrender.com
      - key: APP_ORIGIN
        value: https://curb-connect-web.onrender.com
      # Shared with the API (fromService above). Generated once by Render.
      - key: MAILER_SHARED_SECRET
        generateValue: true
      # base64 of 32 random bytes (npm run keys -w @fieldline/mailer). Entered once; never overwritten.
      - key: MAILER_TOKEN_ENCRYPTION_KEY
        sync: false
      # Tables live in the "mailer" schema of the same database; the API's restricted role cannot read it.
      - key: MAILER_DATABASE_URL
        fromDatabase:
          name: curb-connect-db
          property: connectionString
      - key: GOOGLE_MAIL_CLIENT_ID
        sync: false
      - key: GOOGLE_MAIL_CLIENT_SECRET
        sync: false
      - key: MICROSOFT_MAIL_CLIENT_ID
        sync: false
      - key: MICROSOFT_MAIL_CLIENT_SECRET
        sync: false
      - key: MICROSOFT_MAIL_TENANT
        value: common
      - key: LOG_LEVEL
        value: info

  - type: web
    name: curb-connect-web
    runtime: node
    plan: free
    region: ohio
    buildCommand: npm ci --include=dev && npm run build -w @fieldline/web
    startCommand: cd apps/web && npx next start --port $PORT
    envVars:
      - key: NODE_VERSION
        value: '24'
      - key: NODE_ENV
        value: production
      # Read at build time by next.config.ts (rewrites /v1/* to the API).
      - key: API_PROXY_TARGET
        value: https://curb-connect-api.onrender.com
