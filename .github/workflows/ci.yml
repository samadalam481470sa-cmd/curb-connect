name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  node:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Unit tests never need external services; database tests run in api-integration.
      - run: npm run test:unit
      - run: npm run build

  api-integration:
    name: API integration (PostgreSQL + PostGIS)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: fieldline
          # Throwaway credential for an ephemeral CI container; not a secret.
          POSTGRES_PASSWORD: fieldline_ci
          POSTGRES_DB: fieldline_test
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U fieldline -d fieldline_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://fieldline:fieldline_ci@localhost:54329/fieldline_test
      TEST_DATABASE_URL: postgres://fieldline:fieldline_ci@localhost:54329/fieldline_test
      SESSION_SECRET: ci-only-session-secret-not-used-outside-this-job-0123456789
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Apply migrations
        run: npm run db:migrate
      - name: API tests (unit + integration)
        run: npm test -w @fieldline/api

  vision:
    name: Vision worker (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/vision
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: services/vision/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest

  e2e:
    name: E2E journeys (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Non-blocking until the acceptance journeys exist (LCH-095). Remove continue-on-error once
    # the first real journey lands so a failing journey blocks merges.
    continue-on-error: true
    needs: node
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run build -w @fieldline/web
      - run: npm run test:e2e
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 14
