name: CI

on:
  # Every push, on any branch: the integration job is the only place RLS and tenancy are exercised.
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  node:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      # Fails fast if a credential was committed, before dependencies are even installed.
      - run: npm run security:secrets
      - run: npm ci
      - run: npm run security:audit
      - run: npm run lint
      - run: npm run typecheck
      # Unit tests never need external services; database tests run in api-integration.
      - run: npm run test:unit
      - run: npm run build
      - run: npm run security:bundle

  api-integration:
    name: API integration (PostgreSQL + PostGIS)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: fieldline
          # Throwaway credential for an ephemeral CI container; not a secret.
          POSTGRES_PASSWORD: fieldline_ci
          POSTGRES_DB: fieldline_test
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U fieldline -d fieldline_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://fieldline:fieldline_ci@localhost:54329/fieldline_test
      TEST_DATABASE_URL: postgres://fieldline:fieldline_ci@localhost:54329/fieldline_test
      # The restricted runtime role (NOSUPERUSER NOBYPASSRLS). Tests connect as this role so the
      # plumbing/tenancy suites prove RLS instead of bypassing it as the owner.
      TEST_APP_DATABASE_URL: postgres://fieldline_app:fieldline_ci_app@localhost:54329/fieldline_test
      SESSION_SECRET: ci-only-session-secret-not-used-outside-this-job-0123456789
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Apply migrations
        run: npm run db:migrate
      # Migration 0002 deliberately creates fieldline_app NOLOGIN (it is reached with SET ROLE in
      # production). Integration tests connect as it directly, so give it a throwaway password for
      # this ephemeral database only; it is scoped to this job and dies with the container.
      - name: Enable the restricted runtime role
        run: >-
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1
          -c "ALTER ROLE fieldline_app LOGIN PASSWORD 'fieldline_ci_app';"
      - name: API integration tests (RLS, tenancy, approvals)
        run: npm run test:integration -w @fieldline/api

  vision:
    name: Vision worker (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/vision
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: services/vision/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest

  e2e:
    name: E2E journeys (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Non-blocking until the acceptance journeys exist (LCH-095). Remove continue-on-error once
    # the first real journey lands so a failing journey blocks merges.
    continue-on-error: true
    needs: node
    # The web app proxies /v1 to the API, and the journeys call /v1/auth/providers and /v1/me, so
    # the API runs here against a throwaway database (same setup as api-integration).
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: fieldline
          POSTGRES_PASSWORD: fieldline_ci
          POSTGRES_DB: fieldline_e2e
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U fieldline -d fieldline_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://fieldline:fieldline_ci@localhost:54329/fieldline_e2e
      APP_DATABASE_URL: postgres://fieldline_app:fieldline_ci_app@localhost:54329/fieldline_e2e
      SESSION_SECRET: ci-only-session-secret-not-used-outside-this-job-0123456789
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run build
      - name: Apply migrations
        run: npm run db:migrate
      - name: Enable the restricted runtime role
        run: >-
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1
          -c "ALTER ROLE fieldline_app LOGIN PASSWORD 'fieldline_ci_app';"
      - name: Start the API on :4000
        env:
          NODE_ENV: production
          API_HOST: 127.0.0.1
          API_PORT: '4000'
        run: |
          (cd apps/api && nohup node dist/main.js > ../../api-e2e.log 2>&1 &)
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4000/v1/health/ready >/dev/null; then exit 0; fi
            sleep 2
          done
          echo "API did not become ready"; cat api-e2e.log; exit 1
      - run: npm run test:e2e
      - name: API log
        if: ${{ failure() }}
        run: cat api-e2e.log
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 14
