name: Field Pro Marketing — Azure App Service
# Isolated from the existing Field Pro app and its API.
# Configure AZURE_WEBAPP_NAME as a repository variable and
# AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID as secrets.
# Configure workload identity federation in Azure for this repository and branch.
# Run manually only after the marketing-site folder has been committed.
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment: marketing-production
    defaults:
      run:
        working-directory: marketing-site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify marketing app exists
        run: test -f package.json && test -f src/app/page.tsx
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check
        run: npm run typecheck
      - name: Build for Azure
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Authenticate to Azure using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy separate marketing site
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: marketing-site
