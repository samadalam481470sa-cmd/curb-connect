<!doctype html><html lang="en"><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>Field Pro Manager</title><body style="background:#08110e;color:white;font:16px Arial;padding:10%"><h1>Field Pro Manager Settings</h1><form id="f"><label>Manager key <input id="k" type="password" required></label><button>Sign in</button></form><p id="m" role="status"></p><div id="panel" hidden>Authenticated. <a href="https://vercel.com/dashboard">Manage deployment in Vercel</a><button id="out">Sign out</button></div><script>const f=document.querySelector('#f'),m=document.querySelector('#m'),p=document.querySelector('#panel');async function status(){let r=await fetch('/api/manager');let d=await r.json();f.hidden=d.authenticated;p.hidden=!d.authenticated;}f.onsubmit=async e=>{e.preventDefault();let r=await fetch('/api/manager',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:document.querySelector('#k').value})});document.querySelector('#k').value='';m.textContent=r.ok?'Access granted':'Invalid key';if(r.ok)status();};document.querySelector('#out').onclick=async()=>{await fetch('/api/manager',{method:'DELETE'});status()};status();</script></body></html>
