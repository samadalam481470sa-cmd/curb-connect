    rule: 'In this document "estimate" means a configurable price calculation, not a binding engineering determination or contractor guarantee.'
    data: 'Store requirement IDs, revision number, author, acceptance status, and evidence links in a tracked specification repository.'
    safety: 'If an assumption changes, issue a decision record and revise dependent calculations, UI copy, and tests together.'
